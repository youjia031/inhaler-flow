<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸訓練器 - Inhaler Flow Monitor (Web)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 30px 30px 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 600;
            color: #1a2b3c;
        }
        .header .sub {
            color: #7a8a9a;
            font-size: 14px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid #eaeef3;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .control-group label {
            font-size: 14px;
            font-weight: 500;
            color: #2c3e50;
        }
        select, input, button {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #d0d8e0;
            font-size: 14px;
            background: white;
            outline: none;
            transition: 0.15s;
        }
        select:focus, input:focus {
            border-color: #1f4e79;
            box-shadow: 0 0 0 3px rgba(31,78,121,0.1);
        }
        button {
            cursor: pointer;
            font-weight: 500;
            background: #f0f4f8;
            border-color: #c8d2dc;
        }
        button:hover {
            background: #e4eaf0;
        }
        button.primary {
            background: #1f4e79;
            color: white;
            border-color: #1f4e79;
            font-weight: 600;
        }
        button.primary:hover {
            background: #163d5e;
        }
        button.danger {
            background: #c0392b;
            color: white;
            border-color: #c0392b;
        }
        button.danger:hover {
            background: #a93226;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stats {
            display: flex;
            gap: 18px 28px;
            margin-left: auto;
            font-size: 14px;
            color: #2c3e50;
            flex-wrap: wrap;
        }
        .stats span {
            background: white;
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid #eaeef3;
        }
        .stats strong {
            color: #1f4e79;
        }
        .chart-wrap {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #eaeef3;
            padding: 8px;
            height: 380px;
            margin-bottom: 16px;
            position: relative;
        }
        #flowChart {
            width: 100% !important;
            height: 100% !important;
        }
        .status-bar {
            background: #1f4e79;
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .status-bar .msg {
            opacity: 0.9;
        }
        .status-bar .peak {
            font-weight: 600;
        }
        .footnote {
            margin-top: 12px;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            font-size: 13px;
            color: #8a9aa8;
        }
        .footnote .ideal-line {
            display: inline-block;
            width: 20px;
            height: 2px;
            background: #2e7d32;
            border-top: 2px dashed #2e7d32;
            margin-right: 6px;
            vertical-align: middle;
        }
        .footnote .patient-line {
            display: inline-block;
            width: 20px;
            height: 3px;
            background: #c0392b;
            margin-right: 6px;
            vertical-align: middle;
        }
        @media (max-width: 700px) {
            .container { padding: 16px; }
            .controls { flex-direction: column; align-items: stretch; }
            .stats { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <h1>💨 呼吸訓練器</h1>
        <span class="sub">Inhaler Flow Monitor · 即時流量監測</span>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="control-group">
            <label>USB Port</label>
            <select id="portSelect" style="min-width:140px;"></select>
            <button id="refreshBtn">Refresh</button>
            <button id="connectBtn" class="primary">Connect</button>
        </div>
        <div class="control-group">
            <label>Patient ID</label>
            <input id="patientInput" placeholder="e.g. P001" value="Demo" style="width:110px;">
        </div>
        <div class="control-group">
            <button id="measureBtn">Start</button>
            <button id="clearBtn">Clear</button>
            <button id="saveBtn" class="primary">Save CSV</button>
        </div>
        <div class="stats">
            <span>Records: <strong id="recordCount">0</strong></span>
            <span>Peak: <strong id="peakValue">—</strong> L/min</span>
            <span>Detected: <strong id="detectedStatus">—</strong></span>
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-wrap">
        <canvas id="flowChart"></canvas>
    </div>

    <!-- Status -->
    <div class="status-bar">
        <span class="msg" id="statusMsg">Not connected</span>
        <span class="peak" id="statusPeak"></span>
    </div>

    <div class="footnote">
        <span><span class="ideal-line"></span> 理想目標</span>
        <span><span class="patient-line"></span> 即時流量</span>
    </div>
</div>

<script>
// ============================================================
// 理想波形 (0.5s per point)
// ============================================================
const IDEAL_FLOW = [0, 40, 40, 40, 40, 20, 5, 0, 0, 0];
const IDEAL_DT = 0.5;

// ============================================================
// 平滑函數
// ============================================================
function smoothCurve(xs, ys) {
    const n = xs.length;
    if (n < 3) return { x: xs, y: ys };
    const sm = [];
    for (let i = 0; i < n; i++) {
        let lo = Math.max(0, i - 1);
        let hi = Math.min(n, i + 2);
        let sum = 0;
        for (let j = lo; j < hi; j++) sum += ys[j];
        sm.push(sum / (hi - lo));
    }
    return { x: xs, y: sm };
}

// ============================================================
// 產生理想曲線
// ============================================================
function generateIdealCurve() {
    const xs = IDEAL_FLOW.map((_, i) => i * IDEAL_DT);
    const ys = [...IDEAL_FLOW];
    if (xs.length >= 4) {
        const n = 300;
        const xnew = [], ynew = [];
        const step = (xs[xs.length-1] - xs[0]) / (n - 1);
        for (let i = 0; i < n; i++) {
            const t = xs[0] + i * step;
            xnew.push(t);
            let idx = 0;
            for (let j = 0; j < xs.length - 1; j++) {
                if (t >= xs[j] && t <= xs[j+1]) { idx = j; break; }
                if (j === xs.length - 2) idx = j;
            }
            const x0 = xs[idx], x1 = xs[idx+1];
            const y0 = ys[idx], y1 = ys[idx+1];
            const frac = (t - x0) / (x1 - x0 || 1);
            ynew.push(Math.max(0, y0 + (y1 - y0) * frac));
        }
        return { x: xnew, y: ynew };
    }
    return { x: xs, y: ys };
}

// ============================================================
// 主程式
// ============================================================
class FlowMonitorApp {
    constructor() {
        this.window_history = [false, false, false];
        this.reader = null;
        this.measuring = false;
        this.t0 = null;
        this.started = false;
        this.times = [];
        this.flows = [];
        this.records = [];
        this.last_fft = null;
        this.prev_flow_yes = false;
        this.connected = false;
        this.port = null;

        this.portSelect = document.getElementById('portSelect');
        this.refreshBtn = document.getElementById('refreshBtn');
        this.connectBtn = document.getElementById('connectBtn');
        this.patientInput = document.getElementById('patientInput');
        this.measureBtn = document.getElementById('measureBtn');
        this.clearBtn = document.getElementById('clearBtn');
        this.saveBtn = document.getElementById('saveBtn');
        this.statusMsg = document.getElementById('statusMsg');
        this.recordCount = document.getElementById('recordCount');
        this.peakValue = document.getElementById('peakValue');
        this.detectedStatus = document.getElementById('detectedStatus');

        this.setupChart();
        this.refreshPorts();
        this.bindEvents();
    }

    setupChart() {
        const ctx = document.getElementById('flowChart').getContext('2d');
        const ideal = generateIdealCurve();

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    {
                        label: '理想目標',
                        data: ideal.x.map((x, i) => ({ x, y: ideal.y[i] })),
                        borderColor: '#2e7d32',
                        backgroundColor: 'transparent',
                        borderDash: [6, 5],
                        borderWidth: 2.5,
                        pointRadius: 0,
                        tension: 0.3,
                        showLine: true,
                        fill: false,
                        order: 1
                    },
                    {
                        label: '即時流量',
                        data: [],
                        borderColor: '#c0392b',
                        backgroundColor: 'rgba(192,57,43,0.06)',
                        borderWidth: 2.8,
                        pointRadius: 0,
                        tension: 0.4,
                        showLine: true,
                        fill: true,
                        order: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { usePointStyle: true, boxWidth: 10 }
                    }
                },
                scales: {
                    x: {
                        type: 'linear',
                        title: { display: true, text: '時間 (秒)' },
                        min: 0,
                        max: 10,
                        grid: { color: '#eef2f6' }
                    },
                    y: {
                        title: { display: true, text: '流量 (L/min)' },
                        min: 0,
                        max: 70,
                        grid: { color: '#eef2f6' }
                    }
                }
            }
        });
    }

    async refreshPorts() {
        try {
            const ports = await navigator.serial.getPorts();
            this.portSelect.innerHTML = '';
            if (ports.length === 0) {
                const opt = document.createElement('option');
                opt.text = '無可用埠 (請先授權)';
                opt.value = '';
                this.portSelect.appendChild(opt);
                this.statusMsg.textContent = '無可用埠，請點 Connect 授權';
                return;
            }
            for (const p of ports) {
                const info = p.getInfo();
                const label = info.usbProductId ? `USB 裝置 (${info.usbVendorId}:${info.usbProductId})` : '序列埠';
                const opt = document.createElement('option');
                opt.value = label;
                opt.text = label;
                this.portSelect.appendChild(opt);
            }
            this.portSelect.selectedIndex = 0;
            this.statusMsg.textContent = `已找到 ${ports.length} 個埠`;
        } catch (e) {
            this.statusMsg.textContent = '⚠️ ' + e.message;
        }
    }

    async toggleConnection() {
        if (this.connected) {
            await this.disconnect();
        } else {
            await this.connect();
        }
    }

    async connect() {
        try {
            let ports = await navigator.serial.getPorts();
            if (ports.length === 0) {
                const newPort = await navigator.serial.requestPort();
                if (!newPort) return;
                await this.refreshPorts();
                return this.connect();
            }
            this.port = ports[0];
            await this.port.open({ baudRate: 115200 });
            this.connected = true;

            this.clearPlot();
            this.records = [];
            this.last_fft = null;
            this.measuring = false;
            this.measureBtn.textContent = 'Start';
            this.updateRecordCount();
            this.prev_flow_yes = false;

            this.connectBtn.textContent = 'Disconnect';
            this.connectBtn.className = 'danger';
            this.portSelect.disabled = true;
            this.refreshBtn.disabled = true;
            this.statusMsg.textContent = '✅ 已連線，等待連續兩次 Flow=YES...';

            this.startReading();
        } catch (e) {
            this.statusMsg.textContent = '❌ ' + e.message;
        }
    }

    async disconnect() {
        if (this.reader) {
            try { await this.reader.cancel(); } catch(e) {}
            this.reader = null;
        }
        if (this.port) {
            try { await this.port.close(); } catch(e) {}
            this.port = null;
        }
        this.connected = false;
        this.connectBtn.textContent = 'Connect';
        this.connectBtn.className = 'primary';
        this.portSelect.disabled = false;
        this.refreshBtn.disabled = false;
        this.statusMsg.textContent = '已斷開連線';
    }

    async startReading() {
        if (!this.port) return;
        const reader = this.port.readable.getReader();
        this.reader = reader;
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        try {
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, { stream: true });
                buffer += chunk;
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed) this.handleLine(trimmed);
                }
            }
        } catch (e) {
            if (e.name !== 'AbortError') console.warn('Read error:', e);
        }
    }

    parseFFT(line) {
        if (!line.includes('[FFT]')) return null;
        const bands = {};
        const regex = /(\d+)k\s*:\s*([-+]?\d*\.?\d+)/g;
        let m;
        while ((m = regex.exec(line)) !== null) {
            const k = parseInt(m[1]);
            const v = parseFloat(m[2]);
            if (k >= 1 && k <= 20) bands[k] = v;
        }
        return Object.keys(bands).length > 0 ? bands : null;
    }

    parseDetect(line) {
        if (!line.includes('[DETECT]')) return null;
        const flowMatch = line.match(/Flow\s*=\s*(YES|no)/i);
        if (!flowMatch) return null;
        const flow_yes = flowMatch[1].toUpperCase() === 'YES';
        let est = 0.0;
        const estMatch = line.match(/Est\s*=\s*([-+]?\d*\.?\d+)/);
        if (estMatch) est = parseFloat(estMatch[1]) || 0;
        let low_e = 0;
        const lowMatch = line.match(/LowEnergy\s*=\s*([-+]?\d+)/);
        if (lowMatch) low_e = parseInt(lowMatch[1]) || 0;
        return { flow_yes, est, low_e };
    }

    handleLine(line) {
        if (!this.measuring) return;

        const fft = this.parseFFT(line);
        if (fft) { this.last_fft = fft; return; }

        const det = this.parseDetect(line);
        if (!det) return;

        let { flow_yes, est, low_e } = det;

        // 雜訊過濾
        let is_candidate = false;
        if (flow_yes || (low_e > 800000 && est > 0.0)) {
            is_candidate = true;
        }
        if (this.last_fft) {
            if ((this.last_fft[1] || 0) > 800000 && (this.last_fft[8] || 0) < 50000) {
                is_candidate = false;
            }
        }

        // 滑動視窗多數決
        this.window_history.shift();
        this.window_history.push(is_candidate);
        const true_count = this.window_history.filter(x => x === true).length;

        if (true_count >= 2) {
            flow_yes = true;
            if (est === 0.0 && low_e > 1000000) est = 15.0;
        } else {
            flow_yes = false;
            est = 0.0;
        }

        // 記錄資料
        const now = Date.now() / 1000;
        const ts = new Date().toISOString().slice(0, -1);
        const elapsed = this.t0 !== null ? (now - this.t0) : 0;

        this.records.push({
            timestamp: ts,
            elapsed: elapsed,
            flow: flow_yes,
            est: est,
            low_energy: low_e,
            fft: this.last_fft || {}
        });
        this.updateRecordCount();

        // 更新偵測狀態
        this.detectedStatus.textContent = flow_yes ? '✅ 吸氣' : '—';

        // 啟動繪圖邏輯
        if (!this.started) {
            if (flow_yes && this.prev_flow_yes) {
                this.started = true;
                this.t0 = now;
                if (this.records.length >= 2) {
                    this.records[this.records.length - 2].elapsed = 0;
                    this.records[this.records.length - 1].elapsed = 0;
                    this.times = [0, 0];
                    this.flows = [
                        this.records[this.records.length - 2].est,
                        this.records[this.records.length - 1].est
                    ];
                } else {
                    this.times = [0];
                    this.flows = [est];
                }
                this.statusMsg.textContent = '💨 偵測到吸氣！';
                this.prev_flow_yes = flow_yes;
                this.redraw();
                return;
            }
            this.prev_flow_yes = flow_yes;
            return;
        }

        this.prev_flow_yes = flow_yes;
        const t = now - this.t0;
        this.times.push(t);
        this.flows.push(est);
        this.redraw();
    }

    updateRecordCount() {
        this.recordCount.textContent = this.records.length;
    }

    redraw() {
        if (!this.chart) return;
        const ds = this.chart.data.datasets;
        let xs = this.times.slice();
        let ys = this.flows.slice();

        if (xs.length >= 3) {
            const smoothed = smoothCurve(xs, ys);
            xs = smoothed.x;
            ys = smoothed.y;
        }

        ds[1].data = xs.map((x, i) => ({ x, y: ys[i] || 0 }));

        if (this.times.length > 0) {
            const xmax = Math.max(10, this.times[this.times.length - 1] + 1);
            this.chart.options.scales.x.max = xmax;
        }
        if (this.flows.length > 0) {
            const ymax = Math.max(70, Math.max(...this.flows) * 1.2);
            this.chart.options.scales.y.max = ymax;
            const peak = Math.max(...this.flows);
            this.peakValue.textContent = peak.toFixed(1) + ' L/min';
        }
        this.chart.update('none');
    }

    toggleMeasuring() {
        this.measuring = !this.measuring;
        if (this.measuring) {
            this.measureBtn.textContent = 'Stop';
            this.measureBtn.className = 'danger';
            this.statusMsg.textContent = '📊 測量中...';
        } else {
            this.measureBtn.textContent = 'Start';
            this.measureBtn.className = '';
            this.statusMsg.textContent = '⏸️ 已暫停';
        }
    }

    clearPlot() {
        this.t0 = null;
        this.started = false;
        this.times = [];
        this.flows = [];
        this.prev_flow_yes = false;
        this.window_history = [false, false, false];
        this.records = [];
        this.last_fft = null;

        if (this.chart) {
            this.chart.data.datasets[1].data = [];
            this.chart.options.scales.x.max = 10;
            this.chart.options.scales.y.max = 70;
            this.chart.update('none');
        }
        this.updateRecordCount();
        this.peakValue.textContent = '—';
        this.detectedStatus.textContent = '—';
        this.statusMsg.textContent = '已清除';
    }

    saveData() {
        if (this.records.length === 0) {
            alert('沒有資料可儲存，請先連線並收集資料。');
            return;
        }
        const patient = this.patientInput.value.trim() || 'unknown';
        const default_name = patient ? `inhaler_data_${patient}` : 'inhaler_data';

        let csv = 'patient_id,timestamp,elapsed_s,flow,est_flow_Lpm,low_energy,';
        for (let k = 1; k <= 20; k++) csv += `${k}kHz,`;
        csv = csv.slice(0, -1) + '\n';

        for (const r of this.records) {
            const row = [
                patient,
                r.timestamp,
                r.elapsed.toFixed(2),
                r.flow ? 'YES' : 'no',
                r.est.toFixed(1),
                r.low_energy
            ];
            for (let k = 1; k <= 20; k++) {
                row.push(r.fft[k] !== undefined ? r.fft[k] : '');
            }
            csv += row.join(',') + '\n';
        }

        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8-sig' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${default_name}.csv`;
        link.click();
        this.statusMsg.textContent = `💾 已儲存 ${this.records.length} 筆資料`;
    }

    bindEvents() {
        this.refreshBtn.addEventListener('click', () => this.refreshPorts());
        this.connectBtn.addEventListener('click', () => this.toggleConnection());
        this.measureBtn.addEventListener('click', () => this.toggleMeasuring());
        this.clearBtn.addEventListener('click', () => this.clearPlot());
        this.saveBtn.addEventListener('click', () => this.saveData());
    }
}

// ============================================================
// 啟動
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    new FlowMonitorApp();
});
</script>
</body>
</html>
